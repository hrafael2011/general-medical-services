[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use real PostgreSQL and DeepSeek API (skip by default)",
    "db: tests that require a real PostgreSQL server (skip when unreachable)",
    "e2e: API end-to-end tests against real PostgreSQL + FastAPI TestClient",
]
addopts = ["-m", "not integration and not e2e"]

